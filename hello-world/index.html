<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Web App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #009688;
        }
        p {
            color: #555;
        }
        button {
            background-color: #009688;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #00796b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello from FastAPI! 🚀</h1>
        <p>This HTML page is served directly from our FastAPI root <code>GET</code> route.</p>
        <button onclick="alert('FastAPI is working perfectly!')">Click Me</button>
    </div>
</body>
</html>
